---
# Playbook zum Prüfen des Training-Status
# Verwendung: ansible-playbook -i inventory.yml status_training.yml

- name: SleepMind - Check Training Status
  hosts: training_nodes
  become: yes
    
  tasks:
    - name: Check running training processes
      shell: pgrep -x training | wc -l
      register: process_count
      changed_when: false

    - name: Count generated games
      shell: |
        total=0
        if [ -f {{ output_dir }}/training_combined.games ]; then
          total=$(wc -l < {{ output_dir }}/training_combined.games)
        fi
        temp=0
        if ls {{ output_dir }}/training_temp_*.* 1> /dev/null 2>&1; then
          temp=$(ls {{ output_dir }}/training_temp_*.* | grep -v '\.log$' | xargs -r cat | wc -l)
        fi
        echo "$((total + temp))"
      register: position_count
      changed_when: false

    - name: Get last log lines
      shell: tail -5 {{ output_dir }}/training.log 2>/dev/null || echo "No log file"
      register: log_tail
      changed_when: false

    - name: Show status
      debug:
        msg: |
          === {{ inventory_hostname }} ===
          Prozesse:   {{ process_count.stdout }}
          Partien:    {{ position_count.stdout }}
          Log: {{ log_tail.stdout }}
